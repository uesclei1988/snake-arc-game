<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake Game - ARC Testnet</title>

  <!-- ARC Wallet SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@arc-web3/sdk"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Snake Game — ARC Testnet</h1>

    <div class="controls">
      <button id="connectWallet">Conectar Wallet ARC</button>
      <span id="walletAddress" class="addr">Nenhuma carteira conectada</span>
    </div>

    <canvas id="game" width="400" height="400"></canvas>

    <div class="hud">
      <div>Score: <span id="score">0</span></div>
      <div id="status">Status: aguardando...</div>
    </div>

    <div class="help">
      Use as setas do teclado para controlar. Quando perder, será solicitado assinar a pontuação.
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
